name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# On main, runs go one at a time: a running deploy always finishes and a queued
# run for an older commit is replaced by the newer one. Superseded PR runs are
# cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    # A hang fails the run instead of blocking main for hours, but only once
    # every test has reported and the report is uploaded. Worst case, every CI
    # journey hangs to its 4-minute test timeout (playwright.config.ts): 7
    # tests on 2 workers is at most 4 in a row on one, 16 min (17 measured
    # with every journey hanging). Before them: setup, under 1 min (allow 3),
    # `pnpm check`, under 1.5 min (allow 3), and the build, which Playwright's
    # webServer gives 3 min. After them: the report's upload (allow 2).
    # 3 + 3 + 3 + 17 + 2 = 28, under 30.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Mesa's lavapipe, so the browser tests draw WebGL on it instead of on
      # Chromium's much slower SwiftShader (see playwright.config.ts).
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends mesa-vulkan-drivers
      # A local `pnpm verify` minus what CI doesn't run here: the local-only
      # suite is absent under CI, and the screenshots have the parallel job
      # below.
      - run: pnpm verify --no-screenshots
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error

  # The screenshot checks, in the Playwright Docker image their baselines were
  # made in (scripts/screenshots.mjs). A job of their own, so they run
  # alongside the checks above instead of after them.
  screenshots:
    runs-on: ubuntu-latest
    # Worst case, all 3 pictures hang to their 4-minute test timeout, one after
    # another on one worker: 12 min. Before them: setup, under 1 min (allow 2),
    # the image, Node and `pnpm install` in it, under 1 min (allow 5), and the
    # build (webServer: 3 min). After them: the upload (allow 2).
    # 2 + 5 + 3 + 12 + 2 = 24, under 30.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/screenshots.mjs
      # A changed picture: its expected (before), actual (after) and diff images.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-results
          path: screenshot-results
          if-no-files-found: ignore

  deploy:
    needs: [checks, screenshots]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Setup and the Playwright install, under 1 min (allow 5), the deploy
    # (allow 3) and the smoke step's 12: 20, under 25.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Ship the build the checks verified, not a rebuild.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Deploy to Cloudflare Workers
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi
          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/wrangler-output.ndjson"
          pnpm exec wrangler deploy
          url=$(jq -r 'select(.type == "deploy") | .targets[0]' "$WRANGLER_OUTPUT_FILE_PATH")
          test -n "$url" && test "$url" != "null"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke check the live URL
        # smoke.mjs waits under 5 min for the live site, then the @smoke test
        # has its 4-minute test timeout, and Playwright takes a few seconds to
        # start: 5 + 4 + 1 = 10, under 12.
        timeout-minutes: 12
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: pnpm smoke "$URL"
